name: base_clean_arch
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  collection: 1.19.1
  connectivity_plus: 6.1.4
  currency_text_input_formatter: 2.2.9
  dio: 5.9.1
  equatable: 2.0.8
  flutter:
