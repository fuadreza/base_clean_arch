  get_it: 9.2.0
  hive_ce: 2.19.3
  hive_ce_flutter: 2.3.4
  intl: 0.20.2
  meta_validator: 0.0.2
  package_info_plus: 9.0.0
  permission_handler: 12.0.1
  shimmer: 3.0.0
  talker_dio_logger: 5.1.13

  hive: any
  flutter_dotenv: any
  ansicolor: any
